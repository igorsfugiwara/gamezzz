<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DIY - Faça você mesmo</title>
  <meta name="description" content="Roguelike de cartas sobre a vida de banda independente: dez noites de estrada, uma van que não deveria funcionar e quatro pessoas tentando continuar amigas." />
</head>
<body>
  <div id="app" class="faca">
    <button class="idioma" id="btn-idioma" aria-label="Idioma / Language">EN</button>

    <!-- Título -->
    <section class="tela tela--titulo" id="titulo">
      <h1 class="logo"><span class="logo__diy">DIY</span><span class="logo__sub">Faça você mesmo</span></h1>
      <p class="sub" data-t="titulo.sub"></p>
      <canvas id="titulo-banda" class="pixel titulo-banda" width="256" height="128" aria-hidden="true"></canvas>
      <div class="botoes">
        <button class="botao botao--forte" id="btn-continuar" hidden></button>
        <button class="botao botao--forte" id="btn-nova" data-t="titulo.nova"></button>
        <button class="botao" id="btn-amigo" hidden></button>
      </div>
      <p class="rodape" id="caderno"></p>
    </section>

    <!-- Banda: nomes editáveis -->
    <section class="tela tela--banda" id="banda-tela" hidden>
      <h2 class="banda-titulo" data-t="banda.titulo"></h2>
      <label class="campo">
        <span data-t="banda.nome"></span>
        <input id="banda-nome" maxlength="28" autocomplete="off" />
      </label>
      <div class="membros-cards" id="banda-membros"></div>
      <div class="botoes botoes--linha">
        <button class="botao" id="btn-voltar-banda">←</button>
        <button class="botao botao--forte" id="btn-bora" data-t="banda.pronto"></button>
      </div>
    </section>

    <!-- HUD da turnê (mapa, evento, pousada) -->
    <header class="hud" id="hud" hidden>
      <div class="recursos" id="recursos"></div>
      <div class="banda" id="banda"></div>
    </header>

    <!-- Mapa: as noites ligadas pela estrada -->
    <section class="tela tela--mapa" id="mapa" hidden>
      <div class="mapa__acoes">
        <button class="botao botao--mini" id="btn-abastecer"></button>
        <button class="botao botao--mini" id="btn-baralho"></button>
        <button class="icone" id="btn-som" aria-label="Som">🔊</button>
        <button class="icone" id="btn-sair" aria-label="Sair">✕</button>
      </div>
      <div class="mapa__rolagem" id="mapa-rolagem">
        <svg class="estradas" id="estradas" aria-hidden="true"></svg>
        <ol class="noites" id="noites"></ol>
      </div>
    </section>

    <!-- Evento / pousada / nó perdido -->
    <section class="tela tela--folha" id="folha" hidden>
      <canvas id="paisagem" class="pixel paisagem" width="480" height="180" hidden></canvas>
      <article class="papel" id="papel">
        <p class="papel__onde" id="folha-onde"></p>
        <h2 class="papel__titulo" id="folha-titulo"></h2>
        <p class="papel__texto" id="folha-texto"></p>
        <div class="escolhas" id="folha-escolhas"></div>
        <div class="desfecho" id="folha-desfecho" hidden>
          <p class="desfecho__texto" id="desfecho-texto"></p>
          <p class="desfecho__efeitos" id="desfecho-efeitos"></p>
          <button class="botao botao--forte" id="btn-seguir"></button>
        </div>
      </article>
    </section>

    <!-- Show -->
    <section class="tela tela--show" id="show" hidden>
      <div class="show__topo">
        <span class="show__lugar" id="show-lugar"></span>
        <span class="show__voz" id="show-voz"></span>
        <span class="show__bloco" id="show-bloco"></span>
      </div>
      <div class="palco">
        <canvas id="cena" class="pixel cena"></canvas>
        <div class="pops" id="pops"></div>
      </div>
      <div class="vu" id="vu" aria-label="Energia do público">
        <div class="vu__segs" id="vu-segs"></div>
        <i class="vu__alvo" id="vu-alvo"></i>
        <b class="vu__num" id="vu-num">0</b>
      </div>
      <div class="show__linha">
        <div class="folego" id="folego" aria-label="Fôlego"></div>
        <span class="espiar" id="espiar"></span>
        <button class="botao botao--mini" id="btn-bloco"></button>
      </div>
      <div class="mao" id="mao"></div>
    </section>

    <!-- Resultado do show -->
    <section class="tela tela--folha" id="resultado" hidden>
      <article class="papel">
        <h2 class="papel__titulo" id="res-titulo"></h2>
        <p class="papel__texto" id="res-texto"></p>
        <ul class="res-numeros" id="res-numeros"></ul>
        <p class="papel__onde" id="res-escolha"></p>
        <div class="recompensas" id="recompensas"></div>
        <button class="botao" id="btn-pular"></button>
      </article>
    </section>

    <!-- Fim: zine -->
    <section class="tela tela--fim" id="fim" hidden>
      <canvas id="zine" class="zine" width="540" height="960"></canvas>
      <div class="botoes">
        <button class="botao botao--forte" id="btn-zine" data-t="fim.zine"></button>
        <button class="botao" id="btn-desafio" data-t="fim.desafio"></button>
        <button class="botao" id="btn-denovo" data-t="fim.denovo"></button>
      </div>
      <p class="retorno" id="fim-retorno" aria-live="polite"></p>
    </section>

    <!-- Baralho / escolher carta para tirar -->
    <section class="modal" id="modal-baralho" hidden>
      <div class="modal__caixa">
        <h2 id="baralho-titulo"></h2>
        <div class="lista-cartas" id="baralho-lista"></div>
        <button class="botao" id="btn-fechar-baralho" data-t="baralho.fechar"></button>
      </div>
    </section>

    <div class="aviso" id="aviso" aria-live="polite"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
