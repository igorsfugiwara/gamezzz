<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #0a0a0f;
    font-family: 'Press Start 2P', monospace;
    color: #e0ffe0;
    overflow: hidden;
    height: 100%;
    width: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(0, 255, 100, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(0, 180, 255, 0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 800px;
    padding: 8px;
    gap: 6px;
  }

  .title {
    font-size: clamp(16px, 4vw, 28px);
    letter-spacing: clamp(6px, 2vw, 16px);
    text-shadow: 0 0 10px rgba(0,255,100,0.6), 0 0 30px rgba(0,255,100,0.3);
  }

  .scoreboard { display: flex; align-items: center; gap: clamp(16px, 5vw, 40px); }
  .scoreboard .score {
    font-size: clamp(20px, 5vw, 32px);
    min-width: 40px; text-align: center;
    text-shadow: 0 0 12px rgba(0,255,100,0.5);
  }
  .scoreboard .label { font-size: clamp(6px, 1.5vw, 9px); opacity: 0.5; letter-spacing: 3px; margin-bottom: 2px; }
  .score-group { display: flex; flex-direction: column; align-items: center; }
  .vs { font-size: clamp(7px, 1.5vw, 10px); opacity: 0.3; letter-spacing: 4px; }

  .canvas-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    max-height: 50vh;
  }

  canvas {
    width: 100%; height: 100%; display: block;
    border: 2px solid rgba(0,255,100,0.2);
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,255,100,0.08), inset 0 0 60px rgba(0,0,0,0.5);
  }

  .overlay {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  .overlay .big {
    font-size: clamp(12px, 3vw, 18px);
    text-shadow: 0 0 20px rgba(0,255,100,0.7);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .overlay .small { font-size: clamp(6px, 1.5vw, 8px); opacity: 0.5; margin-top: 10px; letter-spacing: 2px; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* --- Mobile Controls --- */
  .mobile-controls {
    display: none;
    width: 100%;
    gap: 10px;
    padding: 8px 0 0;
  }

  .ctrl-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .ctrl-btn {
    flex: 1;
    min-height: 58px;
    border: 2px solid rgba(0,255,100,0.25);
    border-radius: 12px;
    background: rgba(0,255,100,0.06);
    color: #00ff66;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 2.8vw, 15px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active, .ctrl-btn.pressed {
    background: rgba(0,255,100,0.22);
    box-shadow: 0 0 18px rgba(0,255,100,0.35);
  }

  .ctrl-btn.start-btn {
    border-color: rgba(0,255,100,0.45);
    background: rgba(0,255,100,0.12);
    font-size: clamp(10px, 2.2vw, 13px);
    letter-spacing: 3px;
  }
  .ctrl-btn.start-btn:active, .ctrl-btn.start-btn.pressed {
    background: rgba(0,255,100,0.32);
    box-shadow: 0 0 22px rgba(0,255,100,0.45);
  }

  .arrow { font-size: clamp(16px, 4vw, 22px); line-height: 1; }

  .desktop-hint {
    font-size: clamp(6px, 1.2vw, 8px);
    opacity: 0.3; letter-spacing: 2px;
    text-align: center; line-height: 2;
  }

  @media (max-width: 768px), (pointer: coarse) {
    .mobile-controls { display: flex; }
    .desktop-hint { display: none; }
    .canvas-container { max-height: 40vh; }
    .game-wrapper { gap: 4px; justify-content: flex-start; padding-top: 6px; }
  }

  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
    pointer-events: none; z-index: 100;
  }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="game-wrapper">
  <div class="title">PONG</div>

  <div class="scoreboard">
    <div class="score-group">
      <div class="label">PLAYER</div>
      <div class="score" id="p1Score">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="score-group">
      <div class="label">CPU</div>
      <div class="score" id="p2Score">0</div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="big">PRESS START</div>
      <div class="small">SPACE OU TOQUE ABAIXO</div>
    </div>
  </div>

  <div class="mobile-controls">
    <div class="ctrl-col">
      <button class="ctrl-btn" id="btnUp"><span class="arrow">&#9650;</span> UP</button>
      <button class="ctrl-btn" id="btnDown"><span class="arrow">&#9660;</span> DOWN</button>
    </div>
    <div class="ctrl-col">
      <button class="ctrl-btn start-btn" id="btnStart">&#9654; START</button>
    </div>
  </div>

  <div class="desktop-hint">W / S &mdash; MOVER &nbsp;&bull;&nbsp; SPACE &mdash; INICIAR</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const p1ScoreEl = document.getElementById('p1Score');
const p2ScoreEl = document.getElementById('p2Score');

const BASE_W = 700, BASE_H = 437;
canvas.width = BASE_W; canvas.height = BASE_H;

const PADDLE_W=10, PADDLE_H=80, BALL_SIZE=10, PADDLE_SPEED=6, BALL_BASE_SPEED=5, AI_SPEED=4.2, WIN_SCORE=7, TRAIL_LENGTH=8;

let state = 'waiting', scores = [0,0], ballTrail = [], particles = [];

const player = { x:20, y:BASE_H/2-PADDLE_H/2, w:PADDLE_W, h:PADDLE_H, dy:0, glow:'#00ff66' };
const cpu    = { x:BASE_W-20-PADDLE_W, y:BASE_H/2-PADDLE_H/2, w:PADDLE_W, h:PADDLE_H, dy:0, glow:'#00bbff' };
const ball   = { x:BASE_W/2, y:BASE_H/2, size:BALL_SIZE, dx:0, dy:0, speed:BALL_BASE_SPEED };

function resetBall(d){
  ball.x=BASE_W/2; ball.y=BASE_H/2;
  const a=(Math.random()*Math.PI/3)-Math.PI/6;
  ball.speed=BALL_BASE_SPEED; ball.dx=Math.cos(a)*ball.speed*d; ball.dy=Math.sin(a)*ball.speed;
  ballTrail=[];
}
function spawnP(x,y,c,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
  particles.push({x,y,dx:Math.cos(a)*s,dy:Math.sin(a)*s,life:1,decay:0.02+Math.random()*0.03,color:c,size:2+Math.random()*3});}
}

// --- Keyboard ---
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();handleStart();}});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

// --- Mobile buttons ---
let mobileUp=false, mobileDown=false;
function addHold(btn,onD,onU){
  const s=e=>{e.preventDefault();onD();btn.classList.add('pressed');};
  const end=e=>{e.preventDefault();onU();btn.classList.remove('pressed');};
  btn.addEventListener('touchstart',s,{passive:false});
  btn.addEventListener('touchend',end,{passive:false});
  btn.addEventListener('touchcancel',end,{passive:false});
  btn.addEventListener('mousedown',s);
  btn.addEventListener('mouseup',end);
  btn.addEventListener('mouseleave',end);
}
addHold(document.getElementById('btnUp'),()=>{mobileUp=true},()=>{mobileUp=false});
addHold(document.getElementById('btnDown'),()=>{mobileDown=true},()=>{mobileDown=false});

const btnStart=document.getElementById('btnStart');
btnStart.addEventListener('touchstart',e=>{e.preventDefault();handleStart();},{passive:false});
btnStart.addEventListener('click',handleStart);

// --- Touch on canvas (drag to move paddle) ---
let touchY=null;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length>0) touchY=e.touches[0].clientY;
  if(state!=='playing') handleStart();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length>0&&touchY!==null){
    const rect=canvas.getBoundingClientRect();
    const scaleY=BASE_H/rect.height;
    const ny=e.touches[0].clientY;
    player.y=Math.max(0,Math.min(BASE_H-player.h,player.y+(ny-touchY)*scaleY));
    touchY=ny;
  }
},{passive:false});
canvas.addEventListener('touchend',()=>{touchY=null;});

function handleStart(){
  if(state==='waiting'||state==='gameover'){
    scores=[0,0]; p1ScoreEl.textContent='0'; p2ScoreEl.textContent='0';
    player.y=BASE_H/2-PADDLE_H/2; cpu.y=BASE_H/2-PADDLE_H/2;
    resetBall(1); state='playing'; overlay.style.display='none';
  } else if(state==='scored'){
    resetBall(ball.dx>0?-1:1); state='playing'; overlay.style.display='none';
  }
}

function update(){
  if(state!=='playing') return;
  player.dy=0;
  if(keys['w']||keys['arrowup']||mobileUp) player.dy=-PADDLE_SPEED;
  if(keys['s']||keys['arrowdown']||mobileDown) player.dy=PADDLE_SPEED;
  player.y=Math.max(0,Math.min(BASE_H-player.h,player.y+player.dy));

  const at=ball.y-cpu.h/2, df=at-cpu.y;
  if(Math.abs(df)>4) cpu.y+=Math.sign(df)*Math.min(AI_SPEED,Math.abs(df));
  cpu.y=Math.max(0,Math.min(BASE_H-cpu.h,cpu.y));

  ballTrail.push({x:ball.x,y:ball.y}); if(ballTrail.length>TRAIL_LENGTH)ballTrail.shift();
  ball.x+=ball.dx; ball.y+=ball.dy;

  if(ball.y-ball.size/2<=0||ball.y+ball.size/2>=BASE_H){
    ball.dy*=-1; ball.y=ball.y-ball.size/2<=0?ball.size/2:BASE_H-ball.size/2;
    spawnP(ball.x,ball.y,'#00ff6644',5);
  }

  function hit(p){return ball.x-ball.size/2<p.x+p.w&&ball.x+ball.size/2>p.x&&ball.y-ball.size/2<p.y+p.h&&ball.y+ball.size/2>p.y;}

  if(hit(player)&&ball.dx<0){
    const h=(ball.y-(player.y+player.h/2))/(player.h/2), a=h*(Math.PI/3);
    ball.speed=Math.min(ball.speed+0.3,10);
    ball.dx=Math.cos(a)*ball.speed; ball.dy=Math.sin(a)*ball.speed;
    ball.x=player.x+player.w+ball.size/2; spawnP(ball.x,ball.y,player.glow,12);
  }
  if(hit(cpu)&&ball.dx>0){
    const h=(ball.y-(cpu.y+cpu.h/2))/(cpu.h/2), a=Math.PI-h*(Math.PI/3);
    ball.speed=Math.min(ball.speed+0.3,10);
    ball.dx=-Math.abs(Math.cos(a)*ball.speed); ball.dy=Math.sin(a)*ball.speed;
    ball.x=cpu.x-ball.size/2; spawnP(ball.x,ball.y,cpu.glow,12);
  }

  if(ball.x<-20){scores[1]++;p2ScoreEl.textContent=scores[1];spawnP(0,ball.y,'#ff4444',20);checkWin(1);}
  else if(ball.x>BASE_W+20){scores[0]++;p1ScoreEl.textContent=scores[0];spawnP(BASE_W,ball.y,'#ff4444',20);checkWin(0);}

  particles=particles.filter(p=>{p.x+=p.dx;p.y+=p.dy;p.life-=p.decay;p.dx*=0.98;p.dy*=0.98;return p.life>0;});
}

function checkWin(s){
  if(scores[s]>=WIN_SCORE){
    state='gameover';
    overlay.innerHTML=`<div class="big">${s===0?'VITÓRIA!':'DERROTA'}</div><div class="small">TOQUE START PARA JOGAR</div>`;
    overlay.style.display='block';
  } else {
    state='scored';
    overlay.innerHTML=`<div class="big">PONTO!</div><div class="small">TOQUE START</div>`;
    overlay.style.display='block';
  }
}

function draw(){
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.setLineDash([8,12]); ctx.strokeStyle='rgba(0,255,100,0.1)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(BASE_W/2,0); ctx.lineTo(BASE_W/2,BASE_H); ctx.stroke(); ctx.setLineDash([]);

  function drawP(p){
    ctx.shadowColor=p.glow; ctx.shadowBlur=18; ctx.fillStyle=p.glow;
    ctx.fillRect(p.x,p.y,p.w,p.h); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(p.x+2,p.y+2,2,p.h-4);
  }
  drawP(player); drawP(cpu);

  ballTrail.forEach((t,i)=>{
    const al=(i/ballTrail.length)*0.3, sz=ball.size*(0.3+(i/ballTrail.length)*0.7);
    ctx.fillStyle=`rgba(0,255,100,${al})`; ctx.beginPath(); ctx.arc(t.x,t.y,sz/2,0,Math.PI*2); ctx.fill();
  });

  if(state==='playing'||state==='scored'){
    ctx.shadowColor='#00ff66'; ctx.shadowBlur=20; ctx.fillStyle='#00ff66';
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.size/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.size/5,0,Math.PI*2); ctx.fill();
  }

  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
gameLoop();
</script>
</body>
</html>
