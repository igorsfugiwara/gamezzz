<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MEMÓRIA ROCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #0b0710;
    font-family: 'Press Start 2P', monospace;
    color: #f2e9f7;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  body { display: flex; align-items: center; justify-content: center; }

  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255, 45, 120, 0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(120, 80, 255, 0.10) 0%, transparent 55%);
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(6px, 1.4vh, 12px);
    padding: clamp(6px, 1.5vh, 14px);
  }

  .hud {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 3.5vw, 32px);
    font-size: clamp(6.5px, 1.4vw, 10px);
    letter-spacing: 1px; color: #9b7fae; flex-shrink: 0;
  }
  .hud b { color: #ffd9ef; font-weight: normal; }

  .board-area { position: relative; display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%; }

  .board {
    display: grid;
    gap: clamp(4px, 0.9vw, 10px);
    perspective: 1200px;
  }

  /* ---------- carta ---------- */
  .card {
    position: relative;
    aspect-ratio: 3 / 4;
    cursor: pointer;
    background: none; border: none; padding: 0;
    transform-style: preserve-3d;
    transition: transform .42s cubic-bezier(.2,.8,.2,1);
    /* `backwards`, nunca `both`: com `both` o estado final da animação de
       entrada continua valendo e sobrescreve o rotateY(180deg) da carta
       virada — a carta simplesmente nunca vira. */
    animation: cair .38s cubic-bezier(.2,.9,.3,1) backwards;
  }
  .card.virada, .card.feita { transform: rotateY(180deg); }
  .card:disabled { cursor: default; }

  @keyframes cair {
    from { opacity: 0; transform: translateY(-26px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .face {
    position: absolute; inset: 0;
    border-radius: clamp(5px, 1vw, 10px);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }

  .face-verso {
    background: linear-gradient(145deg, #2a1040 0%, #17082a 100%);
    border: 2px solid rgba(255, 45, 120, 0.42);
    box-shadow: inset 0 0 22px rgba(0,0,0,.65);
  }
  .face-verso::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px);
  }
  .verso-icone { font-size: clamp(14px, 3.4vw, 26px); opacity: .85; filter: drop-shadow(0 0 8px rgba(255,45,120,.6)); }

  .face-frente {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #1c1226 0%, #120a1a 100%);
    border: 2px solid var(--cor, #ff2d78);
    gap: 4%;
    padding: 6%;
  }

  .emblema { width: 56%; max-height: 46%; }
  .banda {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(7px, 1.55vw, 13px);
    line-height: 1.1;
    text-align: center;
    color: #fff;
    letter-spacing: .4px;
    text-transform: uppercase;
  }
  .ano { font-size: clamp(5.5px, 1vw, 8px); color: var(--cor, #ff2d78); letter-spacing: 1px; }

  .card.feita .face-frente {
    box-shadow: 0 0 0 2px var(--cor), 0 0 22px -2px var(--cor);
    animation: acerto .55s ease;
  }
  @keyframes acerto {
    0%   { transform: rotateY(0) scale(1); }
    45%  { transform: rotateY(0) scale(1.09); }
    100% { transform: rotateY(0) scale(1); }
  }

  .card.erro { animation: tremer .19s linear 2; }
  @keyframes tremer {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    25%     { transform: rotateY(180deg) translateX(-5px); }
    75%     { transform: rotateY(180deg) translateX(5px); }
  }

  .card.onda { animation: onda .6s ease var(--atraso, 0s); }
  @keyframes onda {
    0%,100% { transform: rotateY(180deg) translateY(0); }
    50%     { transform: rotateY(180deg) translateY(-14px); }
  }

  /* ---------- telas ---------- */
  .screen {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(8px, 2.2vh, 18px);
    background: rgba(11, 7, 16, .955);
    text-align: center; padding: 4%;
    line-height: 1.7;
  }
  .screen[hidden] { display: none; }

  .title {
    font-size: clamp(13px, 3.6vw, 28px);
    color: #ff2d78; letter-spacing: clamp(2px, 1vw, 8px);
    text-shadow: 0 0 14px rgba(255,45,120,.65), 0 0 38px rgba(255,45,120,.28);
    line-height: 1.5;
  }
  .sub { font-size: clamp(6.5px, 1.4vw, 10px); color: #9b7fae; letter-spacing: 1px; }

  .modos { display: flex; flex-direction: column; gap: clamp(6px, 1.5vh, 11px); width: min(330px, 80%); }

  button.menu-btn {
    font-family: inherit; cursor: pointer;
    color: #ffd9ef;
    background: rgba(255, 45, 120, .08);
    border: 2px solid rgba(255, 45, 120, .45);
    border-radius: 7px;
    padding: clamp(8px, 1.8vh, 13px) 10px;
    font-size: clamp(7.5px, 1.6vw, 11px);
    letter-spacing: 1px; line-height: 1.5;
    transition: background .15s, border-color .15s, transform .08s;
  }
  button.menu-btn:hover { background: rgba(255,45,120,.19); border-color: rgba(255,45,120,.85); }
  button.menu-btn:active { transform: translateY(1px); }
  button.menu-btn .tag { display: block; font-size: .72em; color: #a78bb8; margin-top: 6px; letter-spacing: 0; }

  .placar { font-size: clamp(9px, 2vw, 14px); color: #ffd9ef; line-height: 2; }
  .rank { font-size: clamp(11px, 2.6vw, 19px); color: #ffd166; letter-spacing: 2px; }

  /* faixa com a curiosidade da banda */
  .faixa {
    flex-shrink: 0;
    min-height: clamp(16px, 3.4vh, 26px);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(9px, 1.8vw, 14px);
    color: #c9a9d8; letter-spacing: .3px;
    text-align: center; padding: 0 8px;
    opacity: 0; transition: opacity .3s;
  }
  .faixa.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; animation: none; }
    .card.erro, .card.onda, .card.feita .face-frente { animation: none; }
    button.menu-btn { transition: none; }
    .faixa { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span>PARES <b id="hud-pares">0/0</b></span>
      <span>JOGADAS <b id="hud-jogadas">0</b></span>
      <span>TEMPO <b id="hud-tempo">0:00</b></span>
    </div>

    <div class="board-area">
      <div class="board" id="board" aria-label="Tabuleiro do jogo da memória"></div>

      <div class="screen" id="scr-start">
        <div class="title">MEMÓRIA ROCK</div>
        <div class="sub">ache os pares · descubra as bandas</div>
        <div class="modos">
          <button class="menu-btn" data-modo="ensaio">ENSAIO<span class="tag">6 pares · sem pressa</span></button>
          <button class="menu-btn" data-modo="show">SHOW<span class="tag">8 pares · alvo 60s</span></button>
          <button class="menu-btn" data-modo="turne">TURNÊ<span class="tag">12 pares · alvo 100s</span></button>
        </div>
      </div>

      <div class="screen" id="scr-over" hidden>
        <div class="title" id="over-title">FIM DE SHOW</div>
        <div class="rank" id="over-rank">HEADLINER</div>
        <div class="placar" id="over-placar"></div>
        <button class="menu-btn" id="btn-again">JOGAR DE NOVO</button>
        <button class="menu-btn" id="btn-menu">TROCAR MODO</button>
      </div>
    </div>

    <div class="faixa" id="faixa"></div>
  </div>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------- conteúdo
  // Emblemas geométricos próprios — logotipo de banda é marca registrada, e o
  // jogo precisa rodar sem rede. Cada um é um SVG desenhado aqui.
  const BANDAS = [
    { nome: 'Led Zeppelin',  ano: 1968, cor: '#e8b64c', forma: 'zepelim',  fato: 'Led Zeppelin nasceu das cinzas dos Yardbirds, em Londres.' },
    { nome: 'Pink Floyd',    ano: 1965, cor: '#7c5cff', forma: 'prisma',   fato: 'O prisma de Pink Floyd virou a capa mais reconhecível do rock.' },
    { nome: 'Queen',         ano: 1970, cor: '#f4d35e', forma: 'coroa',    fato: 'Freddie Mercury desenhou o próprio brasão de Queen.' },
    { nome: 'Black Sabbath', ano: 1968, cor: '#8e8e93', forma: 'cruz',     fato: 'Black Sabbath é apontada como a certidão de nascimento do heavy metal.' },
    { nome: 'Ramones',       ano: 1974, cor: '#4a7bd8', forma: 'escudo',   fato: 'Os Ramones tocavam músicas de dois minutos — e mais de 2.200 shows.' },
    { nome: 'Nirvana',       ano: 1987, cor: '#f2c14e', forma: 'sorriso',  fato: 'Nirvana levou o som de Seattle para o mundo inteiro em 1991.' },
    { nome: 'Metallica',     ano: 1981, cor: '#d64545', forma: 'raio',     fato: 'Metallica gravou um álbum inteiro com uma orquestra sinfônica.' },
    { nome: 'AC/DC',         ano: 1973, cor: '#e63946', forma: 'corrente', fato: 'O nome AC/DC veio da etiqueta de uma máquina de costura.' },
    { nome: 'The Beatles',   ano: 1960, cor: '#e0e0e0', forma: 'besouro',  fato: 'Os Beatles pararam de fazer turnê em 1966 para viver no estúdio.' },
    { nome: 'Rolling Stones',ano: 1962, cor: '#e8453c', forma: 'lingua',   fato: 'A língua dos Rolling Stones foi criada por um estudante de arte.' },
    { nome: 'The Who',       ano: 1964, cor: '#4a90d9', forma: 'alvo',     fato: 'The Who transformou destruir instrumentos em parte do show.' },
    { nome: 'Iron Maiden',   ano: 1975, cor: '#c1272d', forma: 'mascara',  fato: 'O mascote Eddie aparece em quase toda capa do Iron Maiden.' },
    { nome: 'Deep Purple',   ano: 1968, cor: '#9b5de5', forma: 'onda',     fato: 'O riff de "Smoke on the Water" é o primeiro que todo guitarrista aprende.' },
    { nome: 'The Doors',     ano: 1965, cor: '#e9a23b', forma: 'porta',    fato: 'The Doors tirou o nome de um verso de William Blake.' },
    { nome: 'Guns N’ Roses', ano: 1985, cor: '#d95d39', forma: 'rosa', fato: 'Guns N’ Roses juntou duas bandas de Los Angeles em uma só.' },
    { nome: 'Pearl Jam',     ano: 1990, cor: '#5fa8a0', forma: 'chama',    fato: 'Pearl Jam peitou a Ticketmaster para baratear o ingresso dos fãs.' },
    { nome: 'Rush',          ano: 1968, cor: '#e05c5c', forma: 'estrela',  fato: 'O Rush fez carreira inteira com os mesmos três integrantes.' },
    { nome: 'Kiss',          ano: 1973, cor: '#f25c54', forma: 'trovao',   fato: 'O Kiss passou uma década inteira sem aparecer sem maquiagem.' },
  ];

  const MODOS = {
    ensaio: { nome: 'ENSAIO', pares: 6,  cols: 4, alvo: null },
    show:   { nome: 'SHOW',   pares: 8,  cols: 4, alvo: 60 },
    turne:  { nome: 'TURNÊ',  pares: 12, cols: 6, alvo: 100 },
  };

  const ICONES_VERSO = ['\u{1F3B8}', '\u{1F941}', '\u{1F3A4}', '\u{1F3B5}'];

  // ------------------------------------------------------------- emblemas
  function emblema(forma, cor) {
    const s = (corpo) => `<svg class="emblema" viewBox="0 0 64 64" fill="none" aria-hidden="true">${corpo}</svg>`;
    const C = cor;
    switch (forma) {
      case 'zepelim':  return s(`<ellipse cx="32" cy="32" rx="27" ry="12" stroke="${C}" stroke-width="3"/><path d="M5 32h54M32 20v24" stroke="${C}" stroke-width="2" opacity=".55"/>`);
      case 'prisma':   return s(`<path d="M32 10 58 52H6z" stroke="${C}" stroke-width="3" stroke-linejoin="round"/><path d="M20 40h30" stroke="#fff" stroke-width="2.5"/><path d="M50 34l8-5M50 40h9M50 46l8 5" stroke="${C}" stroke-width="2"/>`);
      case 'coroa':    return s(`<path d="M8 46h48l-5-28-11 11-8-15-8 15-11-11z" stroke="${C}" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="52" r="3" fill="${C}"/>`);
      case 'cruz':     return s(`<path d="M32 8v48M14 26h36" stroke="${C}" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="24" stroke="${C}" stroke-width="2" opacity=".45"/>`);
      case 'escudo':   return s(`<path d="M32 6l24 8v20c0 14-11 21-24 24C19 55 8 48 8 34V14z" stroke="${C}" stroke-width="3" stroke-linejoin="round"/><path d="M20 30h24M32 22v18" stroke="${C}" stroke-width="2.5"/>`);
      case 'sorriso':  return s(`<circle cx="32" cy="32" r="24" stroke="${C}" stroke-width="3"/><path d="M20 42c6 6 18 6 24 0" stroke="${C}" stroke-width="3" stroke-linecap="round"/><path d="M20 22l8 8m0-8l-8 8M36 22l8 8m0-8l-8 8" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`);
      case 'raio':     return s(`<path d="M36 6L14 36h13l-5 22 24-32H32z" stroke="${C}" stroke-width="3" stroke-linejoin="round"/>`);
      case 'corrente': return s(`<path d="M24 24l-8 8a9 9 0 0013 13l5-5" stroke="${C}" stroke-width="4" stroke-linecap="round"/><path d="M40 40l8-8a9 9 0 00-13-13l-5 5" stroke="${C}" stroke-width="4" stroke-linecap="round"/>`);
      case 'besouro':  return s(`<ellipse cx="32" cy="36" rx="15" ry="19" stroke="${C}" stroke-width="3"/><path d="M32 17V8M25 13l-6-6M39 13l6-6M17 30H8M47 30h9M17 44H9M47 44h8" stroke="${C}" stroke-width="2.5" stroke-linecap="round"/>`);
      case 'lingua':   return s(`<path d="M12 26c0-10 9-16 20-16s20 6 20 16c0 14-11 26-20 26S12 40 12 26z" stroke="${C}" stroke-width="3"/><path d="M26 30c0 8 3 14 6 14s6-6 6-14" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`);
      case 'alvo':     return s(`<circle cx="32" cy="32" r="24" stroke="${C}" stroke-width="3"/><circle cx="32" cy="32" r="14" stroke="${C}" stroke-width="3" opacity=".6"/><circle cx="32" cy="32" r="5" fill="${C}"/>`);
      case 'mascara':  return s(`<path d="M32 8c13 0 22 9 22 22 0 16-10 26-22 26S10 46 10 30C10 17 19 8 32 8z" stroke="${C}" stroke-width="3"/><path d="M20 28l9 5-9 5zM44 28l-9 5 9 5z" fill="${C}"/><path d="M24 48h16" stroke="${C}" stroke-width="2.5" stroke-linecap="round"/>`);
      case 'onda':     return s(`<path d="M6 40c6-16 12-16 18 0s12 16 18 0 12-16 16-6" stroke="${C}" stroke-width="3.5" stroke-linecap="round"/><path d="M6 24c6-10 12-10 18 0" stroke="${C}" stroke-width="2" opacity=".5"/>`);
      case 'porta':    return s(`<rect x="16" y="8" width="32" height="48" rx="2" stroke="${C}" stroke-width="3"/><circle cx="40" cy="34" r="2.5" fill="${C}"/><path d="M16 8l16 12 16-12" stroke="${C}" stroke-width="2" opacity=".5"/>`);
      case 'rosa':     return s(`<circle cx="32" cy="26" r="13" stroke="${C}" stroke-width="3"/><circle cx="32" cy="26" r="6" stroke="${C}" stroke-width="2.5"/><path d="M32 39v17M32 46l-11-5M32 50l11-5" stroke="${C}" stroke-width="2.5" stroke-linecap="round"/>`);
      case 'chama':    return s(`<path d="M32 6c8 12 16 15 16 27a16 16 0 11-32 0c0-12 8-15 16-27z" stroke="${C}" stroke-width="3" stroke-linejoin="round"/><path d="M32 30c3 5 6 7 6 12a6 6 0 11-12 0c0-5 3-7 6-12z" fill="${C}" opacity=".75"/>`);
      case 'estrela':  return s(`<path d="M32 6l7 19h20L43 37l6 20-17-12-17 12 6-20L5 25h20z" stroke="${C}" stroke-width="3" stroke-linejoin="round"/>`);
      case 'trovao':   return s(`<path d="M18 8v26M18 34c0 10 6 16 14 16s14-6 14-16V8" stroke="${C}" stroke-width="4" stroke-linecap="round"/><path d="M40 52l6 8M24 52l-6 8" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`);
      default:         return s(`<circle cx="32" cy="32" r="22" stroke="${C}" stroke-width="3"/>`);
    }
  }

  // ------------------------------------------------------------- estado
  const board = document.getElementById('board');
  const faixa = document.getElementById('faixa');

  let modo, cartas, viradas, paresFeitos, jogadas, travado,
      inicio, timerId = null, tempo = 0;

  const embaralhar = (a) => {
    const c = a.slice();
    for (let i = c.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
  };

  function iniciar(chave) {
    modo = { ...MODOS[chave], chave };
    const escolhidas = embaralhar(BANDAS).slice(0, modo.pares);
    cartas = embaralhar([...escolhidas, ...escolhidas]);

    viradas = [];
    paresFeitos = 0;
    jogadas = 0;
    travado = false;
    tempo = 0;
    inicio = Date.now();

    board.style.gridTemplateColumns = `repeat(${modo.cols}, 1fr)`;
    board.innerHTML = '';

    cartas.forEach((banda, i) => {
      const b = document.createElement('button');
      b.className = 'card';
      b.type = 'button';
      b.style.setProperty('--cor', banda.cor);
      b.style.animationDelay = (i * 0.04) + 's';
      b.dataset.indice = String(i);
      b.dataset.banda = banda.nome;
      b.setAttribute('aria-label', 'Carta virada para baixo');
      b.innerHTML =
        `<span class="face face-verso"><span class="verso-icone">${ICONES_VERSO[i % ICONES_VERSO.length]}</span></span>` +
        `<span class="face face-frente">${emblema(banda.forma, banda.cor)}` +
        `<span class="banda">${banda.nome}</span><span class="ano">${banda.ano}</span></span>`;
      b.addEventListener('click', () => virar(b, banda));
      board.appendChild(b);
    });

    ajustarTabuleiro();
    atualizarHud();
    mostrar(null);
    faixa.classList.remove('on');

    clearInterval(timerId);
    timerId = setInterval(() => {
      tempo = Math.floor((Date.now() - inicio) / 1000);
      atualizarHud();
    }, 500);
  }

  function atualizarHud() {
    document.getElementById('hud-pares').textContent = `${paresFeitos}/${modo ? modo.pares : 0}`;
    document.getElementById('hud-jogadas').textContent = jogadas;
    const m = Math.floor(tempo / 60), s = tempo % 60;
    document.getElementById('hud-tempo').textContent = `${m}:${String(s).padStart(2, '0')}`;
  }

  function virar(el, banda) {
    // A trava é por estado, não por timeout: clique durante a animação é ignorado
    if (travado) return;
    if (el.classList.contains('virada') || el.classList.contains('feita')) return;

    el.classList.add('virada');
    el.setAttribute('aria-label', `${banda.nome}, ${banda.ano}`);
    viradas.push({ el, banda });

    if (viradas.length < 2) return;

    jogadas++;
    atualizarHud();
    travado = true;

    const [a, b] = viradas;
    if (a.banda.nome === b.banda.nome) {
      paresFeitos++;
      a.el.classList.add('feita');
      b.el.classList.add('feita');
      a.el.disabled = b.el.disabled = true;
      mostrarFato(a.banda);
      viradas = [];
      travado = false;
      atualizarHud();
      if (paresFeitos === modo.pares) terminar();
    } else {
      a.el.classList.add('erro');
      b.el.classList.add('erro');
      setTimeout(() => {
        [a, b].forEach(({ el: e }) => {
          e.classList.remove('virada', 'erro');
          e.setAttribute('aria-label', 'Carta virada para baixo');
        });
        viradas = [];
        travado = false;
      }, 700);
    }
  }

  function mostrarFato(banda) {
    faixa.textContent = banda.fato;
    faixa.classList.add('on');
  }

  function terminar() {
    clearInterval(timerId);
    tempo = Math.floor((Date.now() - inicio) / 1000);

    // Classificação: jogadas perfeitas seriam = pares. Tempo só conta se há alvo.
    const extras = jogadas - modo.pares;
    let rank;
    if (extras <= Math.ceil(modo.pares * 0.5) && (!modo.alvo || tempo <= modo.alvo)) rank = 'HEADLINER';
    else if (extras <= modo.pares * 1.5) rank = 'MUSICISTA';
    else rank = 'ROADIE';

    const m = Math.floor(tempo / 60), s = tempo % 60;
    document.getElementById('over-rank').textContent = rank;
    document.getElementById('over-placar').innerHTML =
      `${modo.pares} PARES<br>${jogadas} JOGADAS<br>${m}:${String(s).padStart(2, '0')}` +
      (modo.alvo ? `<br><span style="font-size:.72em;color:#9b7fae">ALVO ${modo.alvo}s</span>` : '');

    document.querySelectorAll('.card.feita').forEach((c, i) => {
      c.style.setProperty('--atraso', (i * 0.05) + 's');
      c.classList.add('onda');
    });

    setTimeout(() => mostrar('scr-over'), 900);
  }

  function mostrar(id) {
    ['scr-start', 'scr-over'].forEach((s) => {
      document.getElementById(s).hidden = (s !== id);
    });
  }

  /** O tabuleiro tem de caber inteiro: sem rolagem dentro do iframe. */
  function ajustarTabuleiro() {
    if (!modo) return;
    const area = document.querySelector('.board-area');
    const linhas = Math.ceil(cartas.length / modo.cols);
    const gap = parseFloat(getComputedStyle(board).gap) || 6;

    const dispW = area.clientWidth - 4;
    const dispH = area.clientHeight - 4;

    // carta é 3:4 — calcula a largura que faz o conjunto caber nos dois eixos
    const porLargura = (dispW - gap * (modo.cols - 1)) / modo.cols;
    const porAltura = ((dispH - gap * (linhas - 1)) / linhas) * (3 / 4);
    const largura = Math.max(34, Math.min(porLargura, porAltura));

    board.style.width = (largura * modo.cols + gap * (modo.cols - 1)) + 'px';
  }

  // ------------------------------------------------------------- eventos
  document.querySelectorAll('[data-modo]').forEach((b) => {
    b.addEventListener('click', () => iniciar(b.dataset.modo));
  });
  document.getElementById('btn-again').addEventListener('click', () => iniciar(modo.chave));
  document.getElementById('btn-menu').addEventListener('click', () => {
    clearInterval(timerId);
    board.innerHTML = '';
    board.style.width = '';
    faixa.classList.remove('on');
    mostrar('scr-start');
  });

  window.addEventListener('resize', ajustarTabuleiro);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('scr-over').hidden) iniciar(modo.chave);
  });
})();
</script>
</body>
</html>
