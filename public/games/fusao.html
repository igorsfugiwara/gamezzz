<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FUSÃO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" href="/games/fontes/acentos-pixel.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Maiúsculas acentuadas vêm de outra fonte em pixel (a Press Start 2P desenha Í, É, Ç e Ã como minúsculas). Ver fontes/LEIA-ME.txt. */
  @font-face { font-family: 'Acentos Pixel'; src: url('/games/fontes/acentos-pixel.woff2') format('woff2'); unicode-range: U+00C0-00D6, U+00D8-00DD; size-adjust: 160%; font-display: swap; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --lado: 360px; --cel: 80px; --gap: 10px; }

  html, body {
    background: #07060d;
    font-family: 'Acentos Pixel', 'Press Start 2P', monospace;
    color: #efe9ff;
    overflow: hidden;
    height: 100%;
    width: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(0, 220, 255, 0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 75% 70%, rgba(255, 60, 200, 0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    padding: 8px;
  }

  .topo { display: flex; gap: 10px; align-items: stretch; width: var(--lado); }
  .titulo {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: clamp(14px, 3.2vh, 22px);
    letter-spacing: 3px;
    color: #4ff0ff;
    text-shadow: 0 0 10px rgba(79, 240, 255, .6);
  }
  .placa {
    min-width: 76px;
    padding: 6px 8px;
    border: 2px solid rgba(79, 240, 255, .35);
    border-radius: 6px;
    text-align: center;
    font-size: 7px;
    color: #8d86b3;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .placa b { display: block; font-size: 12px; color: #fff; font-weight: normal; }
  .ganho { position: absolute; font-size: 10px; color: #7dffb0; animation: sobe .7s ease-out forwards; pointer-events: none; }
  @keyframes sobe { to { transform: translateY(-26px); opacity: 0; } }

  .tabuleiro {
    position: relative;
    width: var(--lado);
    height: var(--lado);
    padding: var(--gap);
    border-radius: 10px;
    background: #13111f;
    border: 2px solid rgba(255, 60, 200, .3);
    box-shadow: 0 0 30px rgba(255, 60, 200, .12);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }
  .vaga { border-radius: 6px; background: rgba(255, 255, 255, .035); }

  .peca {
    position: absolute;
    top: 0; left: 0;
    width: var(--cel);
    height: var(--cel);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cel) * 0.3);
    transition: transform .11s ease-in-out;
    z-index: 2;
  }
  .peca .in {
    width: 100%; height: 100%;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid currentColor;
    background: color-mix(in srgb, currentColor 14%, #0d0b18);
    box-shadow: 0 0 calc(var(--cel) * .18) color-mix(in srgb, currentColor 45%, transparent), inset 0 0 calc(var(--cel) * .2) color-mix(in srgb, currentColor 18%, transparent);
    text-shadow: 0 0 8px currentColor;
  }
  .peca.nova .in { animation: nasce .18s ease .08s both; }
  .peca.fundiu .in { animation: funde .2s ease; }
  @keyframes nasce { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes funde { 50% { transform: scale(1.18); } }
  .peca.d3 { font-size: calc(var(--cel) * 0.24); }
  .peca.d4 { font-size: calc(var(--cel) * 0.19); }
  .peca.d5 { font-size: calc(var(--cel) * 0.15); }

  .barra { display: flex; gap: 8px; }
  button {
    font-family: inherit;
    cursor: pointer;
    color: #efe9ff;
    background: rgba(79, 240, 255, .07);
    border: 2px solid rgba(79, 240, 255, .45);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: clamp(8px, 1.4vh, 10px);
    letter-spacing: 1px;
    line-height: 1.4;
    transition: background .15s, border-color .15s, transform .08s;
  }
  button:hover { background: rgba(79, 240, 255, .17); border-color: #4ff0ff; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  body.touch button { min-height: 42px; }
  .dica { font-size: clamp(6px, 1.2vh, 8px); color: #8d86b3; letter-spacing: 1px; text-align: center; line-height: 1.8; }

  .screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(7, 6, 13, .86);
    text-align: center;
    padding: 8%;
    line-height: 1.6;
  }
  .screen[hidden] { display: none; }
  .screen .t { font-size: clamp(14px, 3vh, 22px); letter-spacing: 3px; color: #ff6bd6; text-shadow: 0 0 12px rgba(255, 107, 214, .6); }
  .screen .t.win { color: #7dffb0; text-shadow: 0 0 12px rgba(125, 255, 176, .6); }
  .screen .s { font-size: 9px; color: #b9b2dd; }

  @media (prefers-reduced-motion: reduce) {
    .peca { transition: none; }
    .peca.nova .in, .peca.fundiu .in { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topo">
      <div class="titulo">FUSÃO</div>
      <div class="placa" id="placa-pontos">PONTOS<b id="pontos">0</b></div>
      <div class="placa">RECORDE<b id="recorde">0</b></div>
    </div>

    <div class="tabuleiro" id="tab">
      <div class="screen" id="scr-fim" hidden>
        <div class="t" id="fim-titulo">SEM JOGADAS</div>
        <div class="s" id="fim-texto"></div>
        <div class="barra">
          <button id="btn-continuar" hidden>CONTINUAR</button>
          <button id="btn-de-novo">JOGAR DE NOVO</button>
        </div>
      </div>
    </div>

    <div class="barra">
      <button id="btn-voltar" disabled>VOLTAR</button>
      <button id="btn-novo">NOVO JOGO</button>
    </div>
    <div class="dica" id="dica">setas ou WASD juntam as peças iguais · chegue a 2048</div>
  </div>

<script src="tutorial.js"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const N = 4;
  // Cada potência de 2 com a sua cor neon.
  const CORES = { 2: '#4ff0ff', 4: '#4fa8ff', 8: '#8c7bff', 16: '#c46bff', 32: '#ff6bd6', 64: '#ff5a8a', 128: '#ff8f3f', 256: '#ffc23f', 512: '#e6ff4f', 1024: '#7dffb0', 2048: '#ffffff' };
  const cor = (v) => CORES[v] || '#ffd700';

  let pecas = [];      // { id, v, r, c, el }
  let proxId = 1;
  let pontos = 0, recorde = 0;
  let venceu = false, continuar = false, travado = false;
  let anterior = null; // um passo de VOLTAR
  let jogadas = 0, fundiu = 0; // tutorial

  try { recorde = Number(localStorage.getItem('fusao:recorde')) || 0; } catch { /* sem storage */ }

  // ================================================================ tamanho
  let CEL = 80, GAP = 10;
  function ajustar() {
    const lado = Math.floor(Math.min(window.innerWidth - 24, window.innerHeight - 190, 520));
    GAP = Math.max(6, Math.round(lado * 0.028));
    CEL = (lado - GAP * 5 - 4) / 4;
    const r = document.documentElement.style;
    r.setProperty('--lado', lado + 'px'); r.setProperty('--cel', CEL + 'px'); r.setProperty('--gap', GAP + 'px');
    pecas.forEach(posicionar);
  }
  const xy = (r, c) => [GAP + c * (CEL + GAP), GAP + r * (CEL + GAP)];

  function posicionar(p) {
    const [x, y] = xy(p.r, p.c);
    p.el.style.transform = `translate(${x}px, ${y}px)`;
  }

  function criarEl(p, classe) {
    const el = document.createElement('div');
    const dig = String(p.v).length;
    el.className = `peca ${classe || ''} ${dig >= 3 ? 'd' + Math.min(5, dig) : ''}`;
    el.style.color = cor(p.v);
    el.innerHTML = `<div class="in">${p.v}</div>`;
    $('tab').appendChild(el);
    p.el = el;
    posicionar(p);
    return el;
  }

  // ================================================================ regras
  function vazias() {
    const ocupado = new Set(pecas.map((p) => p.r * N + p.c));
    const v = [];
    for (let i = 0; i < N * N; i++) if (!ocupado.has(i)) v.push(i);
    return v;
  }

  function nascer() {
    const v = vazias();
    if (!v.length) return;
    const i = v[Math.floor(Math.random() * v.length)];
    const p = { id: proxId++, v: Math.random() < 0.9 ? 2 : 4, r: (i / N) | 0, c: i % N };
    pecas.push(p);
    criarEl(p, 'nova');
  }

  function grade() {
    const g = Array.from({ length: N }, () => new Array(N).fill(null));
    pecas.forEach((p) => { g[p.r][p.c] = p; });
    return g;
  }

  function podeMover() {
    if (vazias().length) return true;
    const g = grade();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (c + 1 < N && g[r][c].v === g[r][c + 1].v) return true;
      if (r + 1 < N && g[r][c].v === g[r + 1][c].v) return true;
    }
    return false;
  }

  function foto() { return { pecas: pecas.map(({ v, r, c }) => ({ v, r, c })), pontos, venceu, continuar }; }

  function mover(dr, dc) {
    if (travado || !$('scr-fim').hidden) return;
    const g = grade();
    const antes = foto();
    let mexeu = false, ganho = 0;
    const removidas = [];
    // Percorre a partir do lado para onde as peças vão.
    const ordem = [...Array(N).keys()];
    const linhas = dr > 0 ? ordem.slice().reverse() : ordem;
    const cols = dc > 0 ? ordem.slice().reverse() : ordem;
    const juntou = new Set();
    for (const r of linhas) for (const c of cols) {
      const p = g[r][c];
      if (!p) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
        const alvo = g[tr][tc];
        if (!alvo) { nr = tr; nc = tc; continue; }
        if (alvo.v === p.v && !juntou.has(alvo.id)) {
          // Fusão: a peça vai até a outra e some; a outra dobra.
          g[r][c] = null;
          p.r = tr; p.c = tc;
          removidas.push(p);
          alvo.v *= 2;
          juntou.add(alvo.id);
          ganho += alvo.v;
          mexeu = true;
          nr = null;
        }
        break;
      }
      if (nr === null) continue;
      if (nr !== r || nc !== c) { g[r][c] = null; g[nr][nc] = p; p.r = nr; p.c = nc; mexeu = true; }
    }
    if (!mexeu) return;
    anterior = antes;
    $('btn-voltar').disabled = false;
    jogadas++;
    travado = true;
    pecas.forEach(posicionar);
    removidas.forEach(posicionar);
    pecas = pecas.filter((p) => !removidas.includes(p));
    setTimeout(() => {
      removidas.forEach((p) => p.el.remove());
      pecas.forEach((p) => {
        if (!juntou.has(p.id)) return;
        const dig = String(p.v).length;
        p.el.className = `peca fundiu ${dig >= 3 ? 'd' + Math.min(5, dig) : ''}`;
        p.el.style.color = cor(p.v);
        p.el.firstChild.textContent = String(p.v);
        fundiu++;
      });
      if (ganho) somar(ganho);
      nascer();
      travado = false;
      conferir();
    }, 115);
  }

  function somar(g) {
    pontos += g;
    $('pontos').textContent = String(pontos);
    const pl = $('placa-pontos').getBoundingClientRect();
    const s = document.createElement('div');
    s.className = 'ganho'; s.textContent = '+' + g;
    s.style.left = pl.left + pl.width / 2 - 14 + 'px'; s.style.top = pl.bottom - 6 + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 750);
    if (pontos > recorde) { recorde = pontos; $('recorde').textContent = String(recorde); try { localStorage.setItem('fusao:recorde', String(recorde)); } catch { /* ok */ } }
  }

  function conferir() {
    if (!venceu && pecas.some((p) => p.v >= 2048)) {
      venceu = true;
      $('fim-titulo').textContent = 'VOCÊ CHEGOU A 2048!';
      $('fim-titulo').className = 't win';
      $('fim-texto').textContent = `${pontos} pontos. Dá para continuar e ir atrás do 4096.`;
      $('btn-continuar').hidden = false;
      $('scr-fim').hidden = false;
      return;
    }
    if (!podeMover()) {
      $('fim-titulo').textContent = 'SEM JOGADAS';
      $('fim-titulo').className = 't';
      const maior = Math.max(...pecas.map((p) => p.v));
      $('fim-texto').textContent = `${pontos} pontos · maior peça ${maior}${pontos >= recorde && pontos > 0 ? ' · NOVO RECORDE!' : ''}`;
      $('btn-continuar').hidden = true;
      $('scr-fim').hidden = false;
    }
  }

  function limpar() { pecas.forEach((p) => p.el.remove()); pecas = []; }

  function novoJogo() {
    limpar();
    pontos = 0; venceu = false; anterior = null;
    $('pontos').textContent = '0';
    $('btn-voltar').disabled = true;
    $('scr-fim').hidden = true;
    nascer(); nascer();
  }

  function voltar() {
    if (!anterior || travado) return;
    limpar();
    anterior.pecas.forEach((q) => { const p = { id: proxId++, ...q }; pecas.push(p); criarEl(p, ''); });
    pontos = anterior.pontos; venceu = anterior.venceu;
    $('pontos').textContent = String(pontos);
    $('scr-fim').hidden = true;
    anterior = null;
    $('btn-voltar').disabled = true;
  }

  // ================================================================ entrada
  const TECLAS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1] };
  window.addEventListener('keydown', (e) => {
    const t = TECLAS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (t) { e.preventDefault(); mover(t[0], t[1]); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); voltar(); }
  });
  let tx = 0, ty = 0, ptr = null;
  window.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; ptr = e.pointerId; tx = e.clientX; ty = e.clientY; });
  window.addEventListener('pointerup', (e) => {
    if (e.pointerId !== ptr) return;
    ptr = null;
    const dx = e.clientX - tx, dy = e.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) mover(0, dx > 0 ? 1 : -1); else mover(dy > 0 ? 1 : -1, 0);
  });

  $('btn-novo').addEventListener('click', novoJogo);
  $('btn-de-novo').addEventListener('click', novoJogo);
  $('btn-voltar').addEventListener('click', voltar);
  $('btn-continuar').addEventListener('click', () => { continuar = true; $('scr-fim').hidden = true; });
  if (matchMedia('(hover: none)').matches) {
    document.body.classList.add('touch');
    $('dica').textContent = 'deslize para juntar as peças iguais · chegue a 2048';
  }

  // ================================================================ tutorial
  const T = window.TutorialJogo;
  const comToque = document.body.classList.contains('touch');
  const tutorial = T ? new T.Tutorial('fusao', [
    { id: 'mover', texto: comToque ? 'Deslize o dedo no tabuleiro: todas as peças andam juntas para esse lado.' : 'Use as setas (ou WASD): todas as peças andam juntas para esse lado.',
      gesto: comToque ? 'arrastar' : 'nenhum', alvo: () => (comToque ? $('tab') : null), lugar: 'topo', ok: () => jogadas >= 2 },
    { id: 'fundir', texto: 'Duas peças iguais que se encostam viram uma só, com o dobro. Tente juntar duas!', gesto: 'nenhum', lugar: 'topo', ok: () => fundiu >= 1 },
    { id: 'meta', texto: 'Continue juntando até chegar a 2048. Dica: guarde a maior peça num canto.', gesto: 'nenhum', lugar: 'topo', segundos: 5 },
  ]) : null;

  $('recorde').textContent = String(recorde);
  for (let i = 0; i < N * N; i++) { const v = document.createElement('div'); v.className = 'vaga'; $('tab').insertBefore(v, $('scr-fim')); }
  ajustar();
  window.addEventListener('resize', ajustar);
  window.addEventListener('orientationchange', ajustar);
  novoJogo();
  tutorial?.iniciar();
})();
</script>
</body>
</html>
